
<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.json">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="weather-app">
        <h1>🌦️ Weather App</h1>
        <p>Discover the weather in any city</p>

        <form id="weatherForm">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
                aria-label="City name"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="message" role="status">Enter a city to get started.</p>

        <section id="weatherResult" class="weather-result" hidden>
            <h2 id="cityName"></h2>
            <div id="weatherIcon" class="weather-icon">🌤️</div>
            <h3 id="temperature"></h3>
            <p id="description"></p>

            <div class="details">
                <div class="detail">
                    <span>💧 Humidity</span>
                    <strong id="humidity"></strong>
                </div>
                <div class="detail">
                    <span>💨 Wind speed</span>
                    <strong id="wind"></strong>
                </div>
                <div class="detail">
                    <span>🌡️ Feels like</span>
                    <strong id="feelsLike"></strong>
                </div>
            </div>
        </section>

        <footer>Weather data by Open-Meteo</footer>
    </main>
    <script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js");
    });
}
</script>
</body>
</html>
